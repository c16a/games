<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff8e8" />
    <meta name="description" content="A cheerful collection of quick games for curious kids." />
    <title>Happy Arcade</title>
    <script>
      (() => {
        // Safari hides extension script URLs and reports their failures as opaque page errors.
        // Ignore only those external failures before Bun's development overlay is installed.
        window.addEventListener("error", (event) => {
          const fromMaskedSafariScript = event.filename.startsWith("webkit-masked-url:");
          const opaqueExternalScriptError = event.message === "Script error."
            && !event.filename
            && event.error == null;
          if (!fromMaskedSafariScript && !opaqueExternalScriptError) return;

          event.preventDefault();
          event.stopImmediatePropagation();
        }, true);

        const storageKey = "happy-arcade-theme";
        let savedTheme;
        try {
          savedTheme = localStorage.getItem(storageKey);
        } catch {}
        const theme = savedTheme === "light" || savedTheme === "dark"
          ? savedTheme
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
